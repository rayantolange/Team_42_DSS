name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Path Filtering Job
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches history so git diff works reliably across pushes

      - name: Check path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Testing/backend/**'
              - 'app/**'
              - 'alembic/**'
              - 'requirements*.txt'
              - 'Dockerfile'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'

  # 2. Backend Tests (Runs only if backend files changed)
  test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: team42_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d team42_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/team42_test
      DATABASE_URL: postgresql://postgres@localhost:5432/team42_test
      SECRET_KEY: test-secret
      REDIS_URL: redis://localhost:6379/0
      # Provide fallback dummy values so drivers don't fail parsing empty strings:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy-key' }}
      NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME || 'neo4j' }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'password' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy-groq-key' }} 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Add this step if you use Alembic:
      - name: Run Database Migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/team42_test

      - name: Run tests with coverage
        run: |
          pytest Testing/backend/tests/ -n auto --maxfail=3 --durations=10 --cov=app --cov-branch --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  # 3. Docker Build Test (Runs only if backend files changed)
  docker-build:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build image
        run: docker build . -t dss:ci

      - name: Smoke-test container boots
        run: |
          docker run -d --name dss-ci-test \
            -e SECRET_KEY=test-secret \
            -e DATABASE_URL="${{ secrets.TEST_DATABASE_URL }}" \
            -e REDIS_URL=redis://localhost:6379/0 \
            -p 8000:8000 dss:ci

          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8000/ > /dev/null; then
              echo "Container is up after ${i}s"
              exit 0
            fi
            echo "Waiting for container... (${i}s)"
            sleep 1
          done

          echo "Container never became healthy — dumping logs:"
          docker logs dss-ci-test
          exit 1

  # 4. Deployment Job (Backend Only)
  deploy:
    needs: [changes, test, docker-build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Render Backend Deployment
      - name: Trigger Render deploy
        if: ${{ needs.changes.outputs.backend == 'true' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --fail --silent --show-error