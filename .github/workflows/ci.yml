name: CI

on:
  push:
    branches: [rayan]
  pull_request:
    branches: [rayan]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SECRET_KEY: test-secret
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest Testing/backend/tests/ --cov=app --cov-branch --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build . -t dss:ci

      - name: Smoke-test container boots
        run: |
          docker run -d --name dss-ci-test \
            -e SECRET_KEY=test-secret \
            -e DATABASE_URL="${{ secrets.TEST_DATABASE_URL }}" \
            -e REDIS_URL=redis://localhost:6379/0 \
            -p 8000:8000 dss:ci

          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8000/ > /dev/null; then
              echo "Container is up after ${i}s"
              exit 0
            fi
            echo "Waiting for container... (${i}s)"
            sleep 1
          done

          echo "Container never became healthy — dumping logs:"
          docker logs dss-ci-test
          exit 1