[pytest]
pythonpath = .
testpaths = Testing/backend
filterwarnings =
    ignore:.*starlette.testclient.*:DeprecationWarning
    ignore:.*httpx2.*:

[coverage:run]
omit =
    app/ai/*
    app/tasks/chat_tasks.py
    app/tasks/embedding_tasks.py
    app/services/chat_service.py
    app/services/embedding_service.py
    app/services/graph_query_service.py
    app/services/graph_retrieval_service.py
    app/repositories/chat_repository.py
    app/repositories/embedding_repository.py
    app/routers/chat_router.py
    app/schemas/chat.py
    app/schemas/citation.py
